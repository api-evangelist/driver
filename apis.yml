aid: driver
name: Driver
description: >-
  Driver is an AI platform that compiles exhaustive, structured context for
  codebases so AI coding agents and engineers can understand architecture,
  dependencies, and history without manually assembling context. It analyzes
  repositories, generates symbol-complete technical documentation, and keeps it
  synchronized as code changes, exposing the result through a hosted Model
  Context Protocol (MCP) server (15 tools) and a REST API. Driver integrates with
  Claude Code, Cursor, and VS Code + Copilot, supports multi-repository and
  multi-branch codebases, and offers enterprise SSO (SAML 2.0), SCIM 2.0
  provisioning, machine identities, and single-tenant/FedRAMP deployment options.
  Backed by GV and Techstars.
